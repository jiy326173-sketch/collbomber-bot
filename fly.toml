app = "collbomber-bot"
primary_region = "bom"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  image = "python:3.12-slim"

[env]
  BOT_TOKEN=""

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["app"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.tcp_checks]]
    interval = 15000
    grace_period = "30s"
    restart_limit = 6
    timeout = "5s"

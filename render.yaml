# 🔥 CollBomber Bot — Render Deployment Config
# No sleep mode, 24/7 uptime

services:
  - type: web
    name: collbomber-bot
    runtime: python
    repo: https://github.com/jiy326173-sketch/collbomber-bot
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_bot:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false  # Set manually in dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"
